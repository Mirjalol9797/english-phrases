<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f9" />
    <meta name="description" content="Изучение английских фраз по урокам с повторением" />
    <title>English Phrases</title>
    <script>
      // Тему и язык выбираем до первой отрисовки: иначе при тёмной теме мелькнёт
      // светлый фон, а при узбекском — русская разметка страницы.
      // Ключи хранилища совпадают с src/stores/settings.ts, цвета — с --paper в src/styles/main.css.
      ;(function () {
        try {
          if (localStorage.getItem('english-phrases:language') === 'uz') document.documentElement.lang = 'uz'
        } catch (e) {}
        var choice = 'system'
        try {
          choice = localStorage.getItem('english-phrases:theme') || 'system'
        } catch (e) {}
        if (choice === 'light' || choice === 'dark') document.documentElement.setAttribute('data-theme', choice)
        else choice = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = choice === 'dark' ? '#10162a' : '#f3f5f9'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
